[package]
name = "hash_core"
version = "0.1.0"
edition = "2021"
description = "Text and streaming file digests: MD5, SHA-1, SHA-2, SHA3-256, BLAKE3, CRC32, and HMAC"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
blake3 = "1"
crc32fast = "1"
digest = "0.10"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
